<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title description">
<title id="title">Yol nişanları və metal dirəklər</title>
<desc id="description">Yol nişanları və metal dirəklər üçün illüstrativ vizual. Legends istehsalat fotosu deyil.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe7ef"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#64727d"/><stop offset=".36" stop-color="#d8e1e6"/><stop offset=".7" stop-color="#8897a2"/><stop offset="1" stop-color="#4e5c67"/></linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#75818b"/><stop offset="1" stop-color="#38444f"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fefefe"/><stop offset="1" stop-color="#dce6eb"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="11" dy="15" stdDeviation="13" flood-color="#26333d" flood-opacity=".22"/></filter>
  <filter id="ground"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1200" height="880" fill="url(#sky)"/>
