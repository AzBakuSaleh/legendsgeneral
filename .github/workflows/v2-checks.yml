name: Legends V2 quality checks

on:
  push:
    branches: ["redesign-v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, lint and static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Next static export (no deployment)
        env:
          NEXT_PUBLIC_BASE_PATH: /legendsgeneral
        run: npm run build

      - name: Confirm no sensitive certificate documents are exported
        run: |
          if find out -type f -iname '*.pdf' | grep -Ei '(sert|cert)'; then
            echo "Certificate PDFs must never be shipped as public assets."
            exit 1
          fi
